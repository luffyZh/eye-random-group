<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>临床试验预约系统 - 双端原型</title>
	<link rel="icon" href="logo.svg" type="image/svg+xml">
	<script src="https://cdn.tailwindcss.com"></script>
	<!-- 引入图标库 -->
	<script src="https://unpkg.com/lucide@latest"></script>
	<style>
			/* 隐藏滚动条但保持滚动功能 */
			.no-scrollbar::-webkit-scrollbar {
					display: none;
			}
			.no-scrollbar {
					-ms-overflow-style: none;
					scrollbar-width: none;
			}
			/* 模拟手机边框光泽 */
			.phone-frame {
					box-shadow: 0 0 0 10px #1f2937, 0 20px 50px -10px rgba(0,0,0,0.5);
			}
			/* 简单的淡入动画 */
			.fade-in {
					animation: fadeIn 0.3s ease-in-out;
			}
			@keyframes fadeIn {
					from { opacity: 0; transform: translateY(5px); }
					to { opacity: 1; transform: translateY(0); }
			}
	</style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center font-sans py-8">
	<div class="flex items-center gap-4 text-center mb-10">
		<img src="logo.svg" alt="logo" class="w-12 h-12 mb-2">
		<h1 class="text-3xl font-bold text-slate-800 mb-2">惟翎·中央随机化系统招募端</h1>
	</div>

	<div class="flex flex-wrap justify-center gap-16 items-start w-full max-w-6xl px-4">
		<!-- 医生端 -->
		<div class="flex flex-col gap-6 items-center space-y-4">
			<!-- 手机容器 -->
			<div class="relative w-[320px] h-[640px] bg-white rounded-[3rem] phone-frame overflow-hidden flex flex-col">
					<!-- 刘海 -->
					<div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-32 h-6 bg-gray-800 rounded-b-xl z-50"></div>
					<!-- 状态栏 -->
					<div class="h-8 bg-white w-full flex justify-between items-center px-6 pt-2 text-[10px] font-bold z-40">
							<span id="doc-clock">09:41</span>
							<div class="flex gap-1">
									<div class="w-4 h-4 rounded-full bg-gray-200"></div>
									<div class="w-4 h-4 rounded-full bg-gray-200"></div>
							</div>
					</div>
					
					<!-- 屏幕内容区域 -->
					<div id="doctor-screen" class="flex-1 bg-gray-50 overflow-y-auto no-scrollbar relative flex flex-col">
							<!-- 动态渲染区域 -->
					</div>
			</div>
			<h2 class="text-xl font-bold text-blue-600 flex items-center gap-2">
				<i data-lucide="stethoscope"></i> 医生视角
			</h2>
		</div>

		<!-- CRC端 -->
		<div class="flex flex-col gap-6 items-center space-y-4">
			<!-- 手机容器 -->
			<div class="relative w-[320px] h-[640px] bg-white rounded-[3rem] phone-frame overflow-hidden flex flex-col">
					<!-- 刘海 -->
					<div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-32 h-6 bg-gray-800 rounded-b-xl z-50"></div>
					<!-- 状态栏 -->
					<div class="h-8 bg-white w-full flex justify-between items-center px-6 pt-2 text-[10px] font-bold z-40">
							<span id="crc-clock">09:41</span>
							<div class="flex gap-1">
									<div class="w-4 h-4 rounded-full bg-gray-200"></div>
									<div class="w-4 h-4 rounded-full bg-gray-200"></div>
							</div>
					</div>

					<!-- 屏幕内容区域 -->
					<div id="crc-screen" class="flex-1 bg-gray-50 overflow-y-auto no-scrollbar relative flex flex-col">
							<!-- 动态渲染区域 -->
					</div>
			</div>
			<h2 class="text-xl font-bold text-indigo-600 flex items-center gap-2">
				<i data-lucide="clipboard-check"></i> CRC 视角
			</h2>
		</div>
	</div>

<!-- JavaScript 逻辑 -->
<script>
	// --- 1. 数据与状态管理 (State Management) ---
	const state = {
		// 模拟数据库
		appointments: [
			{ id: '101', name: '张伟', phone: '13800138000', gender: '', age: '', diopter: '', status: 'PENDING_INFO', doctor: '李医生', time: '10:30' },
			{ id: '102', name: '王芳', phone: '13912345678', gender: '女', age: '28', diopter: '-3.50', status: 'PENDING_CONFIRM', doctor: '李医生', time: '09:15' }
		],
		
		// 医生端状态
		doc: {
			isLoggedIn: false,
			currentTab: 'home', // home, records, profile
			view: 'list', // list, form
			formData: { name: '', phone: '', gender: '', age: '', diopter: '' }
		},

		// CRC端状态
		crc: {
			isLoggedIn: false,
			currentTab: 'home', // home, records, profile
				selectedApptId: null, // null means list view
				filter: 'todo' // todo, done
		}
	};

	// --- 2. 核心渲染控制器 (Render Controllers) ---
	function renderAll() {
		renderDoctor();
		renderCRC();
		lucide.createIcons(); // 重新渲染图标
	}

	// 渲染医生端
	function renderDoctor() {
		const screen = document.getElementById('doctor-screen');
		
		if (!state.doc.isLoggedIn) {
			screen.innerHTML = renderLogin('doc');
			return;
		}

		let content = '';
		// 底部导航
		const nav = renderBottomNav('doc', state.doc.currentTab);

		if (state.doc.currentTab === 'home') {
			if (state.doc.view === 'list') {
				content = renderDocHome();
			} else {
				content = renderDocForm();
			}
		} else if (state.doc.currentTab === 'records') {
			content = renderRecords('doc');
		} else {
			content = renderProfile('doc', '李医生');
		}

		screen.innerHTML = `
			<div class="flex-1 overflow-y-auto no-scrollbar pb-20 fade-in">${content}</div>
			${nav}
		`;
	}

	// 渲染CRC端
	function renderCRC() {
		const screen = document.getElementById('crc-screen');

		if (!state.crc.isLoggedIn) {
			screen.innerHTML = renderLogin('crc');
			return;
		}

		let content = '';
		const nav = renderBottomNav('crc', state.crc.currentTab);

		if (state.crc.currentTab === 'home') {
			if (!state.crc.selectedApptId) {
				content = renderCRCHome();
			} else {
				content = renderCRCDetail();
			}
		} else if (state.crc.currentTab === 'records') {
			content = renderRecords('crc');
		} else {
			content = renderProfile('crc', '张协调员');
		}

		screen.innerHTML = `
			<div class="flex-1 overflow-y-auto no-scrollbar pb-20 fade-in">${content}</div>
			${nav}
		`;
	}

	// --- 3. 页面组件模版 (Components) ---
	// 登录页
	function renderLogin(role) {
		const isDoc = role === 'doc';
		const color = isDoc ? 'blue' : 'indigo';
		const icon = isDoc ? 'stethoscope' : 'clipboard-check';
		const title = isDoc ? '医生工作台' : 'CRC 工作台';
		
		return `
			<div class="flex flex-col items-center justify-center h-full p-8 bg-white">
					<div class="w-20 h-20 bg-${color}-100 rounded-2xl flex items-center justify-center text-${color}-600 mb-6">
							<i data-lucide="${icon}" width="40" height="40"></i>
					</div>
					<h2 class="text-2xl font-bold text-gray-900 mb-2">欢迎登录</h2>
					<p class="text-gray-500 mb-10">${title}</p>
					
					<div class="w-full space-y-4">
							<div>
									<label class="text-xs font-bold text-gray-600 ml-1">账号</label>
									<input type="text" value="${isDoc ? 'Dr.Li' : 'CRC.Zhang'}" class="w-full p-3 bg-gray-50 rounded-xl border border-gray-200 outline-none focus:border-${color}-500 transition-colors">
							</div>
							<div>
									<label class="text-xs font-bold text-gray-600 ml-1">密码</label>
									<input type="password" value="******" class="w-full p-3 bg-gray-50 rounded-xl border border-gray-200 outline-none focus:border-${color}-500 transition-colors">
							</div>
							<button onclick="actions.login('${role}')" class="w-full bg-${color}-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-${color}-700 active:scale-95 transition-all mt-4">
									立即登录
							</button>
					</div>
			</div>
		`;
	}

	// 底部导航
	function renderBottomNav(role, activeTab) {
		const color = role === 'doc' ? 'text-blue-600' : 'text-indigo-600';
		const base = 'text-gray-400';
		
		return `
				<div class="absolute bottom-0 left-0 w-full h-16 bg-white border-t border-gray-100 flex justify-around items-center z-10">
						<button onclick="actions.switchTab('${role}', 'home')" class="flex flex-col items-center gap-1 ${activeTab === 'home' ? color : base}">
								<i data-lucide="${role === 'doc' ? 'home' : 'layout-list'}" width="20"></i>
								<span class="text-[10px] font-medium">首页</span>
						</button>
						<button onclick="actions.switchTab('${role}', 'records')" class="flex flex-col items-center gap-1 ${activeTab === 'records' ? color : base}">
								<i data-lucide="clock" width="20"></i>
								<span class="text-[10px] font-medium">记录</span>
						</button>
						<button onclick="actions.switchTab('${role}', 'profile')" class="flex flex-col items-center gap-1 ${activeTab === 'profile' ? color : base}">
								<i data-lucide="user" width="20"></i>
								<span class="text-[10px] font-medium">我的</span>
						</button>
				</div>
		`;
	}

	// 状态徽章 helper
	function getStatusBadge(status) {
		const map = {
			'PENDING_INFO': { class: 'bg-yellow-100 text-yellow-700', text: '待补充资料' },
			'PENDING_CONFIRM': { class: 'bg-blue-100 text-blue-700', text: '待CRC确认' },
			'APPOINTED': { class: 'bg-green-100 text-green-700', text: '预约成功' },
			'CLOSED': { class: 'bg-gray-100 text-gray-500', text: '已关闭' },
			'ENROLLED': { class: 'bg-purple-100 text-purple-700', text: '已入组' }
		};
		const s = map[status] || map['CLOSED'];
		return `<span class="px-2 py-0.5 rounded text-[10px] font-bold ${s.class}">${s.text}</span>`;
	}

	// --- 医生端组件 ---
	function renderDocHome() {
		const myApps = state.appointments.filter(a => a.doctor === '李医生');
		const pending = myApps.filter(a => a.status === 'PENDING_CONFIRM').length;
		const success = myApps.filter(a => a.status === 'APPOINTED' || a.status === 'ENROLLED').length;

		return `
				<div class="p-5 space-y-6">
						<div class="flex justify-between items-center">
								<div>
										<h2 class="text-xl font-bold text-gray-900">中心医院眼科</h2>
										<p class="text-xs text-gray-400">项目: 近视防控临床试验</p>
								</div>
								<div class="w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-sm text-gray-400">
										<i data-lucide="bell" width="16"></i>
								</div>
						</div>

						<div class="bg-gradient-to-r from-blue-500 to-blue-600 rounded-2xl p-5 text-white shadow-blue-200 shadow-xl">
								<div class="flex justify-between items-start mb-4">
										<div>
												<p class="text-xs opacity-80 mb-1">本月推荐绩效</p>
												<h3 class="text-3xl font-bold">${pending + success} <span class="text-sm font-normal opacity-80">人</span></h3>
										</div>
										<i data-lucide="trending-up" class="opacity-50"></i>
								</div>
								<div class="flex gap-4 text-xs font-medium opacity-90">
										<span class="bg-white/20 px-2 py-1 rounded">待确认: ${pending}</span>
										<span class="bg-white/20 px-2 py-1 rounded">已成功: ${success}</span>
								</div>
						</div>

						<div>
								<h3 class="text-sm font-bold text-gray-900 mb-3">最近记录</h3>
								<div class="space-y-3">
										${myApps.slice(0, 3).map(app => `
												<div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
														<div class="flex items-center gap-3">
																<div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 font-bold text-sm">
																		${app.name[0]}
																</div>
																<div>
																		<p class="text-sm font-bold text-gray-900">${app.name}</p>
																		<p class="text-xs text-gray-400">${app.time}</p>
																</div>
														</div>
														${getStatusBadge(app.status)}
												</div>
										`).join('')}
								</div>
						</div>
				</div>
				
				<!-- 悬浮按钮 -->
				<button onclick="actions.openDocForm()" class="absolute bottom-20 right-5 bg-blue-600 text-white p-4 rounded-full shadow-xl hover:bg-blue-700 active:scale-90 transition-all flex items-center gap-2 pr-6 z-20">
						<i data-lucide="plus"></i>
						<span class="font-bold">预约患者</span>
				</button>
		`;
	}

	function renderDocForm() {
		const form = state.doc.formData;
		const isFull = form.name && form.phone && form.gender && form.age && form.diopter;

		return `
				<div class="p-5 flex flex-col min-h-full bg-white">
						<div class="flex items-center gap-2 mb-6">
								<button onclick="actions.closeDocForm()" class="p-2 -ml-2 hover:bg-gray-100 rounded-full"><i data-lucide="arrow-left"></i></button>
								<h2 class="text-lg font-bold">推荐患者</h2>
						</div>

						<div class="space-y-6 flex-1">
								<div class="space-y-3">
										<h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider">基础信息 (必填)</h3>
										<input type="text" placeholder="患者姓名" value="${form.name}" oninput="actions.updateDocForm('name', this.value)" class="w-full p-3 bg-gray-50 rounded-xl border border-gray-200 outline-none focus:border-blue-500">
										<input type="tel" placeholder="联系电话" value="${form.phone}" oninput="actions.updateDocForm('phone', this.value)" class="w-full p-3 bg-gray-50 rounded-xl border border-gray-200 outline-none focus:border-blue-500">
								</div>

								<div class="space-y-3">
										<div class="flex justify-between items-center">
												<h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider">维度信息 (选填)</h3>
												<span class="text-[10px] text-orange-500 bg-orange-50 px-2 py-1 rounded font-bold">填全可锁定名额</span>
										</div>
										<div class="grid grid-cols-2 gap-3">
												<select onchange="actions.updateDocForm('gender', this.value)" class="w-full p-3 bg-gray-50 rounded-xl border border-gray-200 outline-none focus:border-blue-500 appearance-none">
														<option value="" disabled ${!form.gender ? 'selected' : ''}>性别</option>
														<option value="男" ${form.gender === '男' ? 'selected' : ''}>男</option>
														<option value="女" ${form.gender === '女' ? 'selected' : ''}>女</option>
												</select>
												<input type="number" placeholder="年龄" value="${form.age}" oninput="actions.updateDocForm('age', this.value)" class="w-full p-3 bg-gray-50 rounded-xl border border-gray-200 outline-none focus:border-blue-500">
										</div>
										<input type="text" placeholder="屈光度 (如 -3.00)" value="${form.diopter}" oninput="actions.updateDocForm('diopter', this.value)" class="w-full p-3 bg-gray-50 rounded-xl border border-gray-200 outline-none focus:border-blue-500">
								</div>

								<!-- 提示框 -->
								<div class="p-3 rounded-xl flex gap-3 ${isFull ? 'bg-green-50 text-green-700' : 'bg-yellow-50 text-yellow-700'}">
										<i data-lucide="${isFull ? 'check-circle' : 'alert-circle'}" width="20"></i>
										<p class="text-xs leading-5">
												${isFull ? '信息完整，提交后将直接<b>锁定名额</b>。' : '信息不全，提交后将作为<b>线索</b>流转给CRC。'}
										</p>
								</div>
						</div>

						<button onclick="actions.submitDocForm()" ${(!form.name || !form.phone) ? 'disabled' : ''} class="w-full mt-6 bg-blue-600 disabled:bg-gray-300 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition-all">
								${isFull ? '立即预约 (抢占名额)' : '提交线索'}
						</button>
				</div>
		`;
	}

	// --- CRC端组件 ---

	function renderCRCHome() {
		const filter = state.crc.filter;
		const list = state.appointments.filter(a => {
				if (filter === 'todo') return ['PENDING_INFO', 'PENDING_CONFIRM'].includes(a.status);
				if (filter === 'done') return ['APPOINTED', 'CLOSED', 'ENROLLED'].includes(a.status);
				return true;
		});

		return `
				<div class="sticky top-0 bg-white/95 backdrop-blur z-10 p-4 border-b border-gray-100">
						<h2 class="text-xl font-bold text-gray-900 mb-4">工作台</h2>
						<div class="flex gap-2">
								<button onclick="actions.setCRCFilter('todo')" class="px-4 py-1.5 rounded-full text-xs font-bold transition-colors ${filter === 'todo' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-500'}">待处理</button>
								<button onclick="actions.setCRCFilter('done')" class="px-4 py-1.5 rounded-full text-xs font-bold transition-colors ${filter === 'done' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-500'}">已完成</button>
								<button onclick="actions.setCRCFilter('all')" class="px-4 py-1.5 rounded-full text-xs font-bold transition-colors ${filter === 'all' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-500'}">全部</button>
						</div>
				</div>

				<div class="p-4 space-y-3">
						${list.length === 0 ? '<div class="text-center text-gray-400 py-10 text-sm">暂无记录</div>' : list.map(app => `
								<div onclick="actions.openCRCDetail('${app.id}')" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 active:scale-95 transition-transform cursor-pointer relative overflow-hidden">
										${app.status === 'PENDING_INFO' ? '<div class="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-bl-lg"></div>' : ''}
										<div class="flex justify-between items-start mb-2">
												<div>
														<span class="font-bold text-gray-900 text-lg mr-2">${app.name}</span>
														<span class="text-xs text-gray-500">${app.gender ? app.gender : '-'} · ${app.age ? app.age + '岁' : '-'}</span>
												</div>
												${getStatusBadge(app.status)}
										</div>
										<div class="text-xs text-gray-400 flex justify-between">
												<span>推荐: ${app.doctor}</span>
												<span>${app.time}</span>
										</div>
										${app.status === 'PENDING_INFO' ? `
												<div class="mt-3 pt-2 border-t border-gray-50 text-xs text-orange-600 flex items-center gap-1 font-medium">
														<i data-lucide="alert-circle" width="12"></i> 需要补全维度信息
												</div>
										` : ''}
								</div>
						`).join('')}
				</div>
		`;
	}

	function renderCRCDetail() {
		const app = state.appointments.find(a => a.id === state.crc.selectedApptId);
		if (!app) return '';

		// 如果是成功状态，显示成功页
		if (app.status === 'APPOINTED') {
				return `
						<div class="flex flex-col items-center justify-center h-full p-6 text-center bg-white">
								<div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center text-green-600 mb-6 animate-bounce">
										<i data-lucide="check" width="40" height="40"></i>
								</div>
								<h2 class="text-2xl font-bold text-gray-900 mb-2">预约确认成功</h2>
								<p class="text-gray-500 mb-8 text-sm">名额已消耗，已自动通知医生。</p>
								
								<div class="w-full space-y-3">
										<button onclick="actions.convertPatient('${app.id}')" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition-all flex items-center justify-center gap-2">
												<i data-lucide="user-plus"></i> 正式录入受试者
										</button>
										<button onclick="actions.closeCRCDetail()" class="w-full bg-gray-50 text-gray-600 py-3 rounded-xl font-bold hover:bg-gray-100">
												返回列表
										</button>
								</div>
								<p class="mt-4 text-xs text-gray-400">点击"正式录入"将自动回填数据至筛选页</p>
						</div>
				`;
		}

		// 正常详情页
		const isEditing = app.status === 'PENDING_INFO';
		const isConfirming = app.status === 'PENDING_CONFIRM';
		const isDone = ['CLOSED', 'ENROLLED'].includes(app.status);

		return `
				<div class="flex flex-col h-full bg-gray-50">
						<div class="bg-white p-4 flex items-center gap-2 shadow-sm z-10">
								<button onclick="actions.closeCRCDetail()"><i data-lucide="arrow-left"></i></button>
								<span class="font-bold ml-2">详情处理</span>
						</div>

						<div class="p-4 flex-1 overflow-y-auto space-y-4">
								<!-- 状态卡片 -->
								<div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
										<div class="flex justify-between items-center mb-1">
												<span class="text-xs text-gray-500 font-bold uppercase">当前状态</span>
												${getStatusBadge(app.status)}
										</div>
										${isConfirming ? '<p class="text-xs text-blue-600 mt-2 bg-blue-50 p-2 rounded">名额已锁定，请尽快确认。</p>' : ''}
								</div>

								<!-- 信息表单 -->
								<div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-4">
										<h3 class="font-bold text-sm border-l-4 border-indigo-500 pl-2">患者信息</h3>
										<div class="grid grid-cols-2 gap-4 text-sm">
												<div>
														<label class="text-gray-400 text-xs block mb-1">姓名</label>
														<div class="font-medium text-lg">${app.name}</div>
												</div>
												<div>
														<label class="text-gray-400 text-xs block mb-1">电话</label>
														<div class="font-medium text-blue-600 flex items-center gap-1">
																${app.phone} <i data-lucide="phone" width="12"></i>
														</div>
												</div>
										</div>

										<div class="border-t border-gray-100 pt-4">
												<label class="text-gray-400 text-xs block mb-3">维度信息 (补全/核对)</label>
												${isEditing ? `
														<!-- 编辑模式 -->
														<div class="space-y-3">
																<div class="grid grid-cols-2 gap-3">
																		<select id="crc-edit-gender" class="w-full p-2 bg-gray-50 rounded-lg border text-sm">
																				<option value="">性别</option>
																				<option value="男">男</option>
																				<option value="女">女</option>
																		</select>
																		<input id="crc-edit-age" type="number" placeholder="年龄" class="w-full p-2 bg-gray-50 rounded-lg border text-sm">
																</div>
																<input id="crc-edit-diopter" type="text" placeholder="屈光度" class="w-full p-2 bg-gray-50 rounded-lg border text-sm">
														</div>
												` : `
														<!-- 只读模式 -->
														<div class="grid grid-cols-3 gap-2 text-sm bg-gray-50 p-3 rounded-lg">
																<div><span class="text-xs text-gray-400 block">性别</span> ${app.gender}</div>
																<div><span class="text-xs text-gray-400 block">年龄</span> ${app.age}</div>
																<div><span class="text-xs text-gray-400 block">屈光</span> ${app.diopter}</div>
														</div>
												`}
										</div>
								</div>
						</div>

						<!-- 底部操作栏 -->
						<div class="bg-white p-4 border-t border-gray-200">
								${isEditing ? `
										<button onclick="actions.saveCRCInfo('${app.id}')" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold shadow hover:bg-indigo-700">保存并校验名额</button>
								` : ''}
								
								${isConfirming ? `
										<div class="grid grid-cols-2 gap-3">
												<button onclick="actions.rejectAppt('${app.id}')" class="border border-red-200 text-red-600 py-3 rounded-xl font-bold hover:bg-red-50">拒绝/关闭</button>
												<button onclick="actions.confirmAppt('${app.id}')" class="bg-indigo-600 text-white py-3 rounded-xl font-bold shadow hover:bg-indigo-700">确认预约</button>
										</div>
								` : ''}

								${isDone ? `
										<button disabled class="w-full bg-gray-100 text-gray-400 py-3 rounded-xl font-bold cursor-not-allowed">流程已结束</button>
								` : ''}
						</div>
				</div>
		`;
	}

	// 通用记录页
	function renderRecords(role) {
		const isDoc = role === 'doc';
		const list = isDoc 
				? state.appointments.filter(a => a.doctor === '李医生')
				: state.appointments;

		return `
				<div class="p-4">
						<h2 class="text-lg font-bold mb-4">历史记录</h2>
						<div class="space-y-3">
								${list.map(app => `
										<div class="bg-white p-3 rounded-lg shadow-sm flex justify-between items-center">
												<div>
														<div class="font-bold text-sm">${app.name}</div>
														<div class="text-xs text-gray-400">${app.time}</div>
												</div>
												${getStatusBadge(app.status)}
										</div>
								`).join('')}
						</div>
				</div>
		`;
	}

	// 通用个人中心
	function renderProfile(role, name) {
		const color = role === 'doc' ? 'blue' : 'indigo';
		return `
				<div class="p-4">
						<div class="bg-white p-6 rounded-2xl shadow-sm flex items-center gap-4 mb-6">
								<div class="w-16 h-16 rounded-full bg-${color}-100 text-${color}-600 flex items-center justify-center text-2xl font-bold">
										${name[0]}
								</div>
								<div>
										<h2 class="text-xl font-bold text-gray-900">${name}</h2>
										<p class="text-gray-500 text-sm">${role === 'doc' ? '临床医生' : 'CRC 协调员'}</p>
								</div>
						</div>
						<button onclick="actions.logout('${role}')" class="w-full bg-white border border-gray-200 text-red-500 py-3 rounded-xl font-bold hover:bg-red-50 flex items-center justify-center gap-2">
								<i data-lucide="log-out" width="18"></i> 退出登录
						</button>
				</div>
		`;
	}

	// --- 4. 交互逻辑 (Actions) ---

	const actions = {
		login: (role) => {
			state[role].isLoggedIn = true;
			renderAll();
		},
		logout: (role) => {
			state[role].isLoggedIn = false;
			renderAll();
		},
		switchTab: (role, tab) => {
			state[role].currentTab = tab;
			// 重置视图状态
			if (role === 'doc') state.doc.view = 'list';
			if (role === 'crc') state.crc.selectedApptId = null;
			renderAll();
		},
		
		// 医生端操作
		openDocForm: () => {
			state.doc.formData = { name: '', phone: '', gender: '', age: '', diopter: '' };
			state.doc.view = 'form';
			renderAll();
		},
		closeDocForm: () => {
			state.doc.view = 'list';
			renderAll();
		},
		updateDocForm: (field, value) => {
			state.doc.formData[field] = value;
			renderDoctor(); // 局部重绘以更新按钮状态
		},
		submitDocForm: () => {
			const f = state.doc.formData;
			const isFull = f.name && f.phone && f.gender && f.age && f.diopter;
			
			const newApp = {
				id: Math.random().toString(36).substr(2, 9),
				name: f.name,
				phone: f.phone,
				gender: f.gender,
				age: f.age,
				diopter: f.diopter,
				status: isFull ? 'PENDING_CONFIRM' : 'PENDING_INFO',
				doctor: '李医生',
				time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
			};
			
			state.appointments.unshift(newApp);
			state.doc.view = 'list';
			renderAll(); // 双端更新
			
			// 模拟 Toast
			alert(isFull ? '名额锁定成功！等待CRC确认。' : '线索已提交！');
		},

		// CRC端操作
		setCRCFilter: (filter) => {
			state.crc.filter = filter;
			renderCRC();
		},
		openCRCDetail: (id) => {
			state.crc.selectedApptId = id;
			renderCRC();
		},
		closeCRCDetail: () => {
			state.crc.selectedApptId = null;
				renderCRC();
		},
		saveCRCInfo: (id) => {
			const gender = document.getElementById('crc-edit-gender').value;
			const age = document.getElementById('crc-edit-age').value;
			const diopter = document.getElementById('crc-edit-diopter').value;

			if (!gender || !age) {
					alert('请至少补全性别和年龄');
					return;
			}

			const app = state.appointments.find(a => a.id === id);
			app.gender = gender;
			app.age = age;
			app.diopter = diopter;
			app.status = 'PENDING_CONFIRM'; // 状态流转
			
			renderAll();
		},
		confirmAppt: (id) => {
			const app = state.appointments.find(a => a.id === id);
				app.status = 'APPOINTED';
				renderAll();
		},
		rejectAppt: (id) => {
			const reason = prompt("请输入拒绝/关闭原因：", "电话空号");
			if (reason) {
				const app = state.appointments.find(a => a.id === id);
				app.status = 'CLOSED';
				state.crc.selectedApptId = null; // 返回列表
				renderAll();
			}
		},
		convertPatient: (id) => {
			const app = state.appointments.find(a => a.id === id);
			app.status = 'ENROLLED';
			alert(`跳转至随机化系统...\n自动回填数据：\n姓名：${app.name}\n电话：${app.phone}`);
			state.crc.selectedApptId = null; // 返回列表
			renderAll();
		}
	};

	// 初始化
	renderAll();

	// 更新时间
	setInterval(() => {
		const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
		document.getElementById('doc-clock').innerText = time;
		document.getElementById('crc-clock').innerText = time;
	}, 1000);

</script>
</body>
</html>
