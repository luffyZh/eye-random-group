<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>惟翎·科研管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* 隐藏数字输入框的上下箭头 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex overflow-hidden">

    <!-- ================= 1. 全局左侧导航栏 (Light Mode) ================= -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col transition-all z-20 shadow-sm shrink-0">
        <div class="px-5 flex items-center gap-3 border-b border-gray-100 h-[73px] shrink-0">
            <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center text-white font-bold text-xl shadow-sm">W</div>
            <h1 class="text-lg font-bold text-gray-800 tracking-wide">惟翎·科研管理</h1>
        </div>
        
        <nav class="flex-1 py-4 space-y-1">
            <div class="px-5 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 mt-2">核心模块</div>
            
            <a href="#" onclick="switchModule('EDC')" id="nav-EDC" class="flex items-center px-5 py-3 bg-blue-50 text-blue-700 border-r-4 border-blue-600 font-medium transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                EDC 电子数据采集
            </a>
            
            <a href="#" onclick="switchModule('IWRS')" id="nav-IWRS" class="flex items-center px-5 py-3 text-gray-600 hover:bg-gray-50 hover:text-blue-600 border-r-4 border-transparent transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                IWRS 中央随机化
            </a>
        </nav>
        
        <div class="p-4 border-t border-gray-100 text-sm flex items-center bg-gray-50">
            <div class="w-9 h-9 rounded-full bg-blue-100 text-blue-700 font-bold mr-3 flex items-center justify-center border border-blue-200">PI</div>
            <div>
                <div class="text-gray-800 font-medium">研究者 (Admin)</div>
                <div class="text-xs text-gray-500">上海市眼病防治中心</div>
            </div>
        </div>
    </aside>

    <!-- ================= 2. 右侧主内容区 ================= -->
    <main class="flex-1 flex flex-col relative overflow-hidden bg-gray-50/50">
        
        <!-- 视图A：项目卡片列表 -->
        <div id="view-project-list" class="flex-1 flex flex-col fade-in block h-full">
            <header class="bg-white px-6 flex items-center border-b border-gray-200 shadow-sm z-10 shrink-0 h-[73px]">
                <h2 class="text-lg font-bold text-gray-800" id="module-title">项目列表</h2>
            </header>
            <div class="flex-1 overflow-y-auto p-8">
                <p class="text-gray-500 mb-6">请选择您要操作的临床研究项目</p>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="project-cards-container">
                    <!-- 卡片由 JS 动态渲染 -->
                </div>
            </div>
        </div>

        <!-- 视图B：项目工作台 (上下布局) -->
        <div id="view-project-dashboard" class="flex-1 flex-col hidden fade-in h-full">
            <header class="bg-white px-6 border-b border-gray-200 flex items-center shadow-sm z-10 shrink-0 h-[73px]">
                <h2 class="text-lg font-bold text-gray-800">项目详情</h2>
            </header>

            <div class="flex-1 overflow-y-auto p-6 space-y-6">
                <!-- 返回链接 + 添加受试者 -->
                <div class="flex items-center justify-between text-sm">
                    <div class="flex items-center">
                        <button onclick="backToProjects()" class="text-gray-500 hover:text-blue-600 flex items-center transition-colors font-medium">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                            返回项目列表
                        </button>
                        <span class="text-gray-300 mx-3">/</span>
                        <span class="font-semibold text-gray-800" id="dash-breadcrumb">项目详情</span>
                    </div>
                    <button onclick="openSubjectDrawer()" class="bg-blue-600 text-white text-sm px-4 py-2 rounded-md hover:bg-blue-700 flex items-center shadow-sm">
                        <svg class="w-4 h-4 mr-1.5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M12 5v14M5 12h14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        添加受试者
                    </button>
                </div>

                <!-- 上：项目信息卡片 -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex justify-between items-start mb-4">
                        <h2 class="text-xl font-bold text-gray-900" id="dash-proj-name">项目名称</h2>
                        <span id="dash-proj-status" class="text-xs font-medium px-2.5 py-1 rounded">状态</span>
                    </div>
                    <p class="text-sm text-gray-600 mb-6" id="dash-proj-desc">项目描述内容...</p>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 pt-4 border-t border-gray-100">
                        <div><div class="text-xs text-gray-400 mb-1">项目代号</div><div class="text-sm font-medium text-gray-800" id="dash-proj-code">CODE</div></div>
                        <div><div class="text-xs text-gray-400 mb-1">主要研究者 (PI)</div><div class="text-sm font-medium text-gray-800" id="dash-proj-pi">PI Name</div></div>
                        <div><div class="text-xs text-gray-400 mb-1">参与中心数量</div><div class="text-sm font-medium text-gray-800" id="dash-proj-centers">0</div></div>
                        <div><div class="text-xs text-gray-400 mb-1">当前入组人数</div><div class="text-sm font-medium text-gray-800" id="dash-proj-enrollment">0</div></div>
                    </div>
                </div>

                <!-- 下：受试者数据表格 -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                    <div class="px-6 py-4 border-b border-gray-200 bg-gray-50/50 space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="text-lg font-bold text-gray-800">受试者列表</h3>
                            <div class="flex items-center gap-3 text-sm">
                                <div class="flex items-center gap-1">
                                    <select id="subject-center-filter" onchange="onSubjectFilterChange()" class="border border-gray-300 rounded-md px-2 py-1 text-sm outline-none focus:ring-1 focus:ring-blue-500">
                                        <option value="all">全部中心</option>
                                        <option value="上海市眼病防治中心">上海市眼病防治中心</option>
                                    </select>
                                </div>
                                <div class="flex items-center gap-1">
                                    <select id="subject-source-filter" onchange="onSubjectFilterChange()" class="border border-gray-300 rounded-md px-2 py-1 text-sm outline-none focus:ring-1 focus:ring-blue-500">
                                        <option value="all">全部来源</option>
                                        <option value="门诊">门诊</option>
                                        <option value="招募">招募</option>
                                    </select>
                                </div>
                                <input id="subject-search-input" type="text" placeholder="筛选号" class="flex-1 text-sm border border-gray-300 rounded-md px-3 py-1.5 focus:ring-1 focus:ring-blue-500 outline-none">
                                <button onclick="applySubjectSearch()" class="text-sm bg-blue-600 text-white px-3 py-1.5 rounded-md hover:bg-blue-700">搜索</button>
                                <button onclick="resetSubjectFilters()" class="text-sm bg-white border border-gray-300 text-gray-700 px-3 py-1.5 rounded-md hover:bg-gray-50">重置</button>
                            </div>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider border-b border-gray-200">
                                    <th class="px-6 py-3 font-medium">
                                        <button id="sort-id-label" onclick="setSubjectSort('id')" class="flex items-center gap-1 hover:text-blue-700 transition">
                                            筛选号
                                            <span id="sort-id-indicator" class="text-gray-300">↕</span>
                                        </button>
                                    </th>
                                    <th class="px-6 py-3 font-medium">随机号</th>
                                    <th class="px-6 py-3 font-medium">受试者缩写</th>
                                    <th class="px-6 py-3 font-medium">受试者来源</th>
                                    <th class="px-6 py-3 font-medium">中心</th>
                                    <th class="px-6 py-3 font-medium">科室</th>
                                    <th class="px-6 py-3 font-medium">入组日期</th>
                                    <th class="px-6 py-3 font-medium">结束日期</th>
                                    <th class="px-6 py-3 font-medium">当前状态</th>
                                    <th class="px-6 py-3 font-medium text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 text-sm" id="subject-table-body">
                                <!-- 表格行由 JS 动态生成 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- 视图C：受试者详情 (高级表单引擎) -->
        <div id="view-subject-detail" class="flex-1 flex-col hidden fade-in h-full">
            <header class="bg-white px-6 border-b border-gray-200 flex items-center shadow-sm z-10 shrink-0 h-[73px]">
                <h2 class="text-lg font-bold text-gray-800">采集数据</h2>
            </header>

            <div class="flex-1 flex flex-col overflow-hidden">
                <div class="px-6 py-3 flex items-center justify-between shrink-0">
                    <div class="flex items-center text-sm">
                        <button onclick="backToDashboard()" class="text-gray-500 hover:text-blue-600 flex items-center transition-colors font-medium">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                            返回项目
                        </button>
                        <span class="text-gray-300 mx-3">/</span>
                        <span class="font-semibold text-gray-800" id="detail-breadcrumb">受试者: XW09001</span>
                    </div>
                    <div class="flex gap-3" id="form-actions">
                        <!-- 读写按钮动态渲染 -->
                    </div>
                </div>

                <div class="flex-1 flex overflow-hidden border-t border-gray-200 bg-gray-50">
                    <!-- 左侧：访视树及受试者信息 (卡片式) -->
                    <aside class="w-64 flex flex-col shrink-0 space-y-4 p-6 pr-0">
                        <!-- 受试者卡片 -->
                        <div class="bg-blue-600 rounded-xl shadow-sm border border-blue-700 p-5 shrink-0 text-white">
                            <div class="text-xs opacity-90 mb-1">当前受试者</div>
                            <div class="font-bold text-xl tracking-tight mb-1" id="sidebar-subject-name">ZSM</div>
                            <div class="text-sm opacity-90" id="sidebar-subject-id">XW09001</div>
                        </div>
                        <!-- 访视节点卡片 -->
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex-1 flex flex-col overflow-hidden">
                            <div class="px-5 py-3 border-b border-gray-100 bg-gray-50/80 font-bold text-gray-700 text-sm shrink-0">访视阶段</div>
                            <nav class="flex-1 overflow-y-auto p-3 space-y-1 no-scrollbar" id="visit-nav">
                                <!-- 访视节点由 JS 动态生成 -->
                            </nav>
                        </div>
                    </aside>

                    <!-- 右侧：动态表单区 -->
                    <main class="flex-1 overflow-y-auto p-6">
                        <div class="w-full bg-white rounded-xl shadow-sm border border-gray-200 p-8 mb-10">
                            <div class="flex justify-between items-end border-b border-gray-200 pb-4 mb-6">
                                <h2 class="text-2xl font-bold text-gray-800" id="current-visit-title">加载中...</h2>
                                <span id="edit-status-badge" class="text-xs px-2 py-1 rounded bg-gray-100 text-gray-600">只读模式</span>
                            </div>
                            <form id="dynamic-form" class="space-y-8" onsubmit="event.preventDefault();">
                                <!-- 表单内容由 JS 动态生成 -->
                            </form>
                        </div>
                    </main>
                </div>
            </div>
        </div>

        <div id="subject-drawer-container"></div>

    </main>

    <script>
        // ================= 数据模拟与结构定义 =================
        const projects = [
            { id: 'P001', code: 'MYOPIA-2025', name: '光刻微结构近视管理镜片在儿童青少年近视防控中的有效性及佩戴安全舒适性的随机对照临床研究', desc: '本研究旨在评估新型光刻微结构镜片在延缓儿童青少年近视进展方面的有效性与安全性。', pi: '张主任', centers: 5, status: '进行中', statusColor: 'bg-blue-100 text-blue-800' },
            { id: 'P002', code: 'ORTHOK-2024', name: '某新型角膜塑形镜多中心随机对照临床试验', desc: '评估夜戴型角膜塑形镜对低中度近视患者的视力矫正效果及角膜安全性。', pi: '李教授', centers: 3, status: '已结束', statusColor: 'bg-gray-100 text-gray-600' },
            { id: 'P003', code: 'ATROPINE-01', name: '低浓度阿托品滴眼液联合光学干预的真实世界研究', desc: '观察0.01%阿托品滴眼液联合离焦眼镜在临床真实环境下的长期控制效果。', pi: '王主任', centers: 8, status: '准备中', statusColor: 'bg-amber-100 text-amber-800' }
        ];

        const subjectsData = {};
        projects.forEach(p => {
            subjectsData[p.id] = Array.from({length: 10}, (_, i) => {
                const num = String(i + 1).padStart(3, '0');
                const isDropOut = i === 8;
                const enrollmentStatus = isDropOut ? '提前退出' : (i < 2 ? '筛选中' : '入组');
                const stage = isDropOut ? '-' : (i < 2 ? '-' : (['基线','3M','6M'][(i - 2) % 3]));
                const enrollmentStatusColor = enrollmentStatus === '提前退出' ? 'text-red-700 bg-red-50' : (enrollmentStatus === '筛选中' ? 'text-amber-700 bg-amber-50' : 'text-green-700 bg-green-50');
                const center = '上海市眼病防治中心';
                const department = '眼科';
                const endDate = isDropOut || p.status === '已结束' ? `2026-01-${String((i%20)+1).padStart(2,'0')}` : '';
                return {
                    id: `S-${p.id}-${num}`,
                    randomId: i < 2 ? '-' : `R${num}`,
                    initials: ['ZSM', 'LJH', 'WXY', 'CQ', 'ZJY'][i % 5],
                    enrollDate: `2025-10-${String((i%20)+1).padStart(2,'0')}`,
                    enrollmentStatus,
                    enrollmentStatusColor,
                    stage,
                    source: ['门诊','招募'][i % 2],
                    center,
                    department,
                    endDate
                };
            });
        });

        const visits = [
            { id: 'v0', name: 'V0 基线期 (0M)' },
            { id: 'v1', name: 'V1 访视 (3M)' },
            { id: 'v2', name: 'V2 访视 (6M)' }
        ];

        // 模拟表单数据 (包含空值测试)
        let formData = {
            "inc_1": "是", "inc_2": "是", "inc_3": "是", "inc_4": "是",
            "exc_1": "否", "exc_2": "否", "exc_3": "否", "exc_4": "否",
            "initials": "ZSM", "gender": "男", "birth_date": "2015-05-12", "height": "145", "weight": "38.5",
            "father_myopia": "有", "father_myopia_degree": "-3.00", "mother_myopia": "无",
            "has_disease": "有", "disease_list": [{ name: "过敏性鼻炎", eye: "4", start_date: "2023-01-01", ongoing: "是", end_date: "", affects: "否" }],
            "has_medication": "无", "medication_list": [],
            "has_allergy": "有", "allergy_desc": "青霉素过敏",
            "has_past_control": "无", "past_control_list": [],
            "ucva_od": "4.8", "ucva_os": "4.8", "bcva_od": "5.0", "bcva_os": "5.0",
            "subj_sph_od": "-2.50", "subj_cyl_od": "-0.50", "subj_sph_os": "-2.25", "subj_cyl_os": "-0.75",
            "obj_sph_od": "-2.75", "obj_cyl_od": "-0.50", "obj_sph_os": "-2.50", "obj_cyl_os": "-0.75"
        };

        const formSchema = [
            {
                title: "1. 审核入选排除标准", type: "criteria",
                groups: [
                    { name: "入选标准 (必须全部为'是')", fields: [
                        { id: "inc_1", label: "年龄：6-14岁" },
                        { id: "inc_2", label: "使用1%盐酸环喷托酯滴眼液睫状肌麻痹后，双眼均在-0.50D～-4.00D，双眼柱镜≤1.50D，屈光参差≤1.50D，最佳矫正视力5.0以上" },
                        { id: "inc_3", label: "3个月内未使用过多焦眼镜、OK镜、角膜塑形镜、渐进眼镜、阿托品滴眼液、红光或针灸治疗等近视防控方法" },
                        { id: "inc_4", label: "受试者有治疗意愿并由其法定监护人签署知情同意书" }
                    ]},
                    { name: "排除标准 (必须全部为'否')", fields: [
                        { id: "exc_1", label: "确诊恒定斜视" }, { id: "exc_2", label: "确诊病理性近视" },
                        { id: "exc_3", label: "其他先天性眼病等" }, { id: "exc_4", label: "研究医生认为不适合纳入项目的其他原因等" }
                    ]}
                ]
            },
            {
                title: "2. 受试者基本信息", type: "grid",
                fields: [
                    { id: "initials", label: "姓名缩写", type: "text", width: "col-span-1" },
                    { id: "gender", label: "性别", type: "radio", options: ["男", "女"], width: "col-span-1" },
                    { id: "birth_date", label: "出生日期", type: "date", width: "col-span-1" },
                    { id: "height", label: "身高 (cm)", type: "number", width: "col-span-1" },
                    { id: "weight", label: "体重 (kg)", type: "number", width: "col-span-1" },
                    { id: "empty", type: "empty", width: "col-span-1" },
                    { id: "father_myopia", label: "父亲家族近视情况", type: "radio_with_input", options: ["无", "有"], inputId: "father_myopia_degree", inputLabel: "近视度数 (D)", inputType: "number", width: "col-span-2" },
                    { id: "mother_myopia", label: "母亲家族近视情况", type: "radio_with_input", options: ["无", "有"], inputId: "mother_myopia_degree", inputLabel: "近视度数 (D)", inputType: "number", width: "col-span-2" },
                    { id: "has_allergy", label: "过敏史", type: "radio_with_input", options: ["无", "有"], inputId: "allergy_desc", inputLabel: "过敏详情", inputType: "text", width: "col-span-2" },
                    { 
                        id: "has_disease", label: "既往/现有疾病信息", tooltip: "尤其是可能影响治疗的眼部疾病和既往3个月全身性疾病", 
                        type: "dynamic_list", listId: "disease_list", width: "col-span-full",
                        columns: [
                            { id: "name", label: "疾病名称", type: "text", width: "w-48" },
                            { id: "eye", label: "眼别", type: "select", options: [{v:"1",l:"右眼"},{v:"2",l:"左眼"},{v:"3",l:"双眼"},{v:"4",l:"NA"}], width: "w-24" },
                            { id: "start_date", label: "开始时间", type: "date", width: "w-36" },
                            { id: "ongoing", label: "是否持续", type: "select", options: [{v:"是",l:"是"},{v:"否",l:"否"}], width: "w-24", triggers: "end_date" },
                            { id: "end_date", label: "结束时间", type: "date", width: "w-36", dependsOn: "ongoing", dependsVal: "否" },
                            { id: "affects", label: "影响研究", type: "select", options: [{v:"是",l:"是"},{v:"否",l:"否"}], width: "w-24" }
                        ]
                    },
                    { 
                        id: "has_medication", label: "既往/正在使用的药物", tooltip: "尤其是可能影响视力、干眼、消炎药、皮质激素类的既往1个月药物", 
                        type: "dynamic_list", listId: "medication_list", width: "col-span-full",
                        columns: [
                            { id: "name", label: "用药名称", type: "text", width: "w-40" },
                            { id: "indication", label: "适应症", type: "text", width: "w-32" },
                            { id: "dosage", label: "用法用量", type: "text", width: "w-32" },
                            { id: "start_date", label: "开始时间", type: "date", width: "w-36" },
                            { id: "ongoing", label: "是否持续", type: "select", options: [{v:"是",l:"是"},{v:"否",l:"否"}], width: "w-24", triggers: "end_date" },

            if (subjectSortField === field) {

            const centerSelect = document.getElementById('subject-center-filter');

            subjectFilterCenter = centerSelect ? centerSelect.value : 'all';

        }

            const input = document.getElementById('subject-search-input');
            subjectSearchQuery = (input?.value || '').trim();
            updateSubjectTable();

            subjectFilterCenter = 'all';
            subjectFilterSource = 'all';

            const sourceSelect = document.getElementById('subject-source-filter');
            const input = document.getElementById('subject-search-input');
            if (centerSelect) centerSelect.value = 'all';
            if (sourceSelect) sourceSelect.value = 'all';

        function getStageClass(stage) {
            if (stage === '基线') return 'text-blue-700 bg-blue-50';
            if (stage === '3M') return 'text-amber-700 bg-amber-50';
            if (stage === '6M') return 'text-violet-700 bg-violet-50';
            return 'text-gray-600 bg-gray-100';
        }

        function getSourceClass(source) {
            if (source === '门诊') return 'text-cyan-700 bg-cyan-50';
            if (source === '招募') return 'text-purple-700 bg-purple-50';
            return 'text-gray-700 bg-gray-100';
        }

        function updateSortIndicators() {
            const lbl = document.getElementById('sort-id-label');
            const ind = document.getElementById('sort-id-indicator');
            if (lbl && ind) {
                if (subjectSortField === 'id') {
                    ind.textContent = subjectSortDir === 'asc' ? '↑' : '↓';
                    ind.className = 'text-blue-700';
                } else {
                    ind.textContent = '↕';
                    ind.className = 'text-gray-300';
                }
            }
        }

        function updateSubjectTable() {
            if (!currentProject) return;
            let list = subjectsData[currentProject.id].slice();
            if (subjectFilterCenter !== 'all') {
                list = list.filter(s => s.center === subjectFilterCenter);
            }
            if (subjectFilterSource !== 'all') {
                list = list.filter(s => s.source === subjectFilterSource);
            }
            if (subjectSearchQuery) {
                list = list.filter(s => s.id.includes(subjectSearchQuery));
            }
            list.sort((a, b) => {
                if (subjectSortField === 'enrollDate') {
                    const da = new Date(a.enrollDate).getTime();
                    const db = new Date(b.enrollDate).getTime();
                    return subjectSortDir === 'asc' ? da - db : db - da;
                } else if (subjectSortField === 'id') {
                    return subjectSortDir === 'asc' ? a.id.localeCompare(b.id) : b.id.localeCompare(a.id);
                }
                return 0;
            });
            const tbody = document.getElementById('subject-table-body');
            tbody.innerHTML = list.map(s => `
                <tr class="hover:bg-blue-50/50 transition-colors group">
                    <td class="px-6 py-4 font-medium text-gray-900">${s.id}</td>
                    <td class="px-6 py-4 text-gray-600">${s.randomId}</td>
                    <td class="px-6 py-4 text-gray-600">${s.initials}</td>
                    <td class="px-6 py-4">

                    </td>
                    <td class="px-6 py-4 text-gray-600">${s.center || '-'}</td>
                    <td class="px-6 py-4 text-gray-600">${s.department || '-'}</td>
                    <td class="px-6 py-4 text-gray-600">${s.enrollDate}</td>
                    <td class="px-6 py-4 text-gray-600">${s.endDate || ''}</td>
                    <td class="px-6 py-4">
                        ${
                            s.enrollmentStatus === '提前退出' 
                            ? `<span class="px-2 py-1 rounded text-xs font-medium ${s.enrollmentStatusColor}">提前退出</span>`
                            : `<span class="px-2 py-1 rounded text-xs font-medium ${s.enrollmentStatusColor}">${s.enrollmentStatus}</span>
                               ${s.stage && s.stage !== '-' ? `<span class="ml-2 px-2 py-1 rounded text-xs font-medium ${getStageClass(s.stage)}">${s.stage}</span>` : ''}`

                    </td>
                    <td class="px-6 py-4 text-right space-x-3">
                        <button onclick="openSubject('${s.id}')" class="text-blue-600 hover:text-blue-800 font-medium">采集数据</button>
                        <button class="text-amber-600 font-medium">退出</button>
                        <button class="text-red-600 font-medium">删除</button>
                    </td>
                </tr>
            `).join('');
            updateSortIndicators();
        }

        function closeSubjectDrawer(reset) {
            if (reset) {
                const initials = document.getElementById('drawer-initials'); if (initials) initials.value = '';
                const screen = document.getElementById('drawer-screen'); if (screen) screen.value = '';
                const random = document.getElementById('drawer-random'); if (random) random.value = '';
                const start = document.getElementById('drawer-start'); if (start) start.value = '';
                const end = document.getElementById('drawer-end'); if (end) end.value = '';
                const rec = document.getElementById('drawer-recorder'); if (rec) rec.value = '';
            }
            const container = document.getElementById('subject-drawer-container');
            container.innerHTML = '';
        }

        function saveSubjectFromDrawer() {
            if (!currentProject) return;
            const source = document.querySelector('input[name="drawer-source"]:checked')?.value || '';
            const initials = (document.getElementById('drawer-initials')?.value || '').trim();
            const screen = (document.getElementById('drawer-screen')?.value || '').trim();
            const random = (document.getElementById('drawer-random')?.value || '').trim();
            const start = (document.getElementById('drawer-start')?.value || '').trim();
            const rec = (document.getElementById('drawer-recorder')?.value || '').trim();
            if (!source || !initials || !screen || !random || !start || !rec) {
                alert('请完整填写带星号的必填项');
                return;
            }
            const newSubject = {
                id: screen,
                randomId: random,
                initials: initials,
                enrollDate: start,
                enrollmentStatus: '入组',
                enrollmentStatusColor: 'text-green-700 bg-green-50',
                stage: '基线',
                source,
                center: '上海市眼病防治中心',
                department: '眼科',
                endDate: ''
            };
            subjectsData[currentProject.id].push(newSubject);
            updateSubjectTable();
            closeSubjectDrawer();
        }

        function loadVisit(visitId) {
            currentVisit = visitId;
            const nav = document.getElementById('visit-nav');
            nav.innerHTML = visits.map(v => {
                const isActive = v.id === currentVisit;
                const baseClass = isActive ? "bg-blue-50 border-blue-500 text-blue-700" : "border-transparent text-gray-600 hover:bg-gray-100";
                return `<div onclick="loadVisit('${v.id}')" class="cursor-pointer px-4 py-3 rounded-md border-l-4 ${baseClass} transition-all font-medium text-sm">${v.name}</div>`;
            }).join('');
            
            const visitName = visits.find(v => v.id === visitId).name;
            document.getElementById('current-visit-title').innerText = `${visitName} 数据采集表`;
            
            renderActions();
            renderForm();
        }

        // ================= 高级表单引擎 =================
        function toggleEditMode() {
            if(isEditMode) {
                // 保存数据：从 DOM 抓取基础字段
                document.querySelectorAll('#dynamic-form input, #dynamic-form select').forEach(el => {
                    if(el.name && !el.name.includes('_list_')) {
                        if(el.type === 'radio') { if(el.checked) formData[el.name] = el.value; }
                        else formData[el.name] = el.value;
                    }
                });
            }
            isEditMode = !isEditMode;
            renderActions();
            renderForm();
        }

            const container = document.getElementById('form-actions');

                badge.innerText = "编辑模式"; badge.className = "text-xs px-2 py-1 rounded bg-amber-100 text-amber-700 font-medium border border-amber-200";
                container.innerHTML = `
                    <button onclick="toggleEditMode()" class="text-sm bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-50 transition font-medium">取消</button>

                badge.innerText = "只读模式"; badge.className = "text-xs px-2 py-1 rounded bg-gray-100 text-gray-600";

                        编辑数据

        function renderForm() {
            const container = document.getElementById('dynamic-form');
            if(currentVisit !== 'v0') {
                container.innerHTML = `<div class="text-gray-400 text-center py-16">该访视节点暂无表单配置</div>`;
                return;
            }

            let html = '';
            formSchema.forEach(sec => {
                html += `<div class="border border-gray-200 rounded-lg overflow-hidden mb-6 shadow-sm">
                            <div class="bg-gray-50 px-5 py-3 border-b border-gray-200 font-bold text-gray-800 flex items-center">
                                <div class="w-1 h-4 bg-blue-600 rounded mr-2"></div>${sec.title}
                            </div><div class="p-5">`;
                if (sec.type === 'criteria') html += renderCriteria(sec);
                else if (sec.type === 'grid') html += renderGrid(sec);
                else if (sec.type === 'eye_grid') html += renderEyeGrid(sec);
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        function renderCriteria(sec) {
            let html = '<div class="space-y-6">';
            sec.groups.forEach(group => {
                html += `<div><h4 class="text-sm font-bold text-gray-700 mb-3 bg-gray-100 inline-block px-3 py-1 rounded">${group.name}</h4><div class="space-y-2">`;
                group.fields.forEach(f => {
                    const val = formData[f.id] || '';
                    html += `<div class="flex justify-between items-start py-2 border-b border-gray-50 hover:bg-gray-50/50 transition px-2 rounded">
                        <div class="text-sm text-gray-700 pr-6 flex-1 leading-relaxed">${f.label}</div>
                        <div class="flex gap-4 shrink-0 mt-0.5">`;
                    if (isEditMode) {
                        html += `<label class="flex items-center gap-1 text-sm cursor-pointer"><input type="radio" name="${f.id}" value="是" ${val==='是'?'checked':''} class="text-blue-600 focus:ring-blue-500"> 是</label>
                                 <label class="flex items-center gap-1 text-sm cursor-pointer"><input type="radio" name="${f.id}" value="否" ${val==='否'?'checked':''} class="text-blue-600 focus:ring-blue-500"> 否</label>`;
                    } else {
                        html += `<span class="font-medium text-sm ${val==='是'?'text-green-600':(val==='否'?'text-red-600':'text-gray-400')}">${val || '--'}</span>`;
                    }
                    html += `</div></div>`;
                });
                html += `</div></div>`;
            });
            return html + '</div>';
        }

        function renderGrid(sec) {
            let html = '<div class="grid grid-cols-4 gap-x-6 gap-y-5">';
            sec.fields.forEach(f => {
                if(f.type === 'empty') { html += `<div class="${f.width}"></div>`; return; }
                html += `<div class="${f.width} flex flex-col">
                    <label class="text-sm font-medium text-gray-600 mb-1.5 flex items-center">
                        ${f.label} ${f.tooltip ? `<svg class="w-4 h-4 ml-1 text-gray-400 cursor-help" title="${f.tooltip}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>` : ''}
                    </label>`;
                const val = formData[f.id] || '';
                if (!isEditMode) {
                    if (f.type === 'radio_with_input') {
                        const inputVal = formData[f.inputId] || '--';
                        html += `<div class="py-2 text-sm font-medium text-gray-900 border-b border-gray-100 min-h-[36px]">${val || '--'} ${val === '有' ? `<span class="text-gray-400 ml-2">| ${f.inputLabel}: <span class="text-gray-900">${inputVal}</span></span>` : ''}</div>`;
                    } else if (f.type === 'dynamic_list') {
                        html += `<div class="py-2 text-sm font-medium text-gray-900 border-b border-gray-100 mb-2">${val || '--'}</div>`;
                        if (val === '有') html += renderDynamicTableReadOnly(f);
                    } else {
                        html += `<div class="py-2 text-sm font-medium text-gray-900 border-b border-gray-100 min-h-[36px]">${val || '--'}</div>`;
                    }
                } else {
                    if (f.type === 'text' || f.type === 'number' || f.type === 'date') {
                        html += `<input type="${f.type}" name="${f.id}" value="${val}" class="border border-gray-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none w-full">`;
                    } else if (f.type === 'radio') {
                        html += `<div class="flex gap-4 mt-2">${f.options.map(opt => `<label class="flex items-center gap-1 text-sm"><input type="radio" name="${f.id}" value="${opt}" ${val===opt?'checked':''} class="text-blue-600"> ${opt}</label>`).join('')}</div>`;
                    } else if (f.type === 'radio_with_input') {
                        const inputVal = formData[f.inputId] || '';
                        html += `<div class="flex items-center gap-4 mt-1">${f.options.map(opt => `<label class="flex items-center gap-1 text-sm"><input type="radio" name="${f.id}" value="${opt}" ${val===opt?'checked':''} onchange="formData['${f.id}']='${opt}'; renderForm()" class="text-blue-600"> ${opt}</label>`).join('')}`;
                        if (val === '有') html += `<div class="flex items-center gap-2 ml-2 fade-in"><span class="text-sm text-gray-500">${f.inputLabel}</span><input type="${f.inputType}" name="${f.inputId}" value="${inputVal}" class="border border-gray-300 rounded-md p-1.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none w-24"></div>`;
                        html += `</div>`;
                    } else if (f.type === 'dynamic_list') {
                        html += `<div class="flex gap-4 mt-1 mb-3">${["无", "有"].map(opt => `<label class="flex items-center gap-1 text-sm"><input type="radio" name="${f.id}" value="${opt}" ${val===opt?'checked':''} onchange="formData['${f.id}']='${opt}'; renderForm()" class="text-blue-600"> ${opt}</label>`).join('')}</div>`;
                        if (val === '有') html += renderDynamicTableEdit(f);
                    }
                }
                html += `</div>`;
            });
            return html + '</div>';
        }

        function renderEyeGrid(sec) {
            let html = `<table class="w-full text-left border-collapse">
                <thead><tr class="bg-gray-50 text-gray-600 text-sm border-b border-gray-200">
                    <th class="py-3 px-4 font-medium w-1/3">检查项目</th>
                    <th class="py-3 px-4 font-medium w-1/3 border-l border-gray-200 text-blue-800 bg-blue-50/30">OD (右眼)</th>
                    <th class="py-3 px-4 font-medium w-1/3 border-l border-gray-200 text-green-800 bg-green-50/30">OS (左眼)</th>
                </tr></thead><tbody class="divide-y divide-gray-100">`;
            sec.rows.forEach(row => {
                const valOD = formData[row.id_od] || ''; const valOS = formData[row.id_os] || '';
                html += `<tr><td class="py-3 px-4 text-sm font-medium text-gray-700">${row.label}</td>`;
                if (isEditMode) {
                    html += `<td class="py-2 px-4 border-l border-gray-100"><input type="${row.type}" step="${row.step||'any'}" name="${row.id_od}" value="${valOD}" class="border border-gray-300 rounded p-1.5 text-sm w-full focus:ring-2 focus:ring-blue-500 outline-none"></td>
                             <td class="py-2 px-4 border-l border-gray-100"><input type="${row.type}" step="${row.step||'any'}" name="${row.id_os}" value="${valOS}" class="border border-gray-300 rounded p-1.5 text-sm w-full focus:ring-2 focus:ring-green-500 outline-none"></td>`;
                } else {
                    html += `<td class="py-3 px-4 border-l border-gray-100 text-sm text-gray-900">${valOD || '<span class="text-gray-300">--</span>'}</td>
                             <td class="py-3 px-4 border-l border-gray-100 text-sm text-gray-900">${valOS || '<span class="text-gray-300">--</span>'}</td>`;
                }
                html += `</tr>`;
            });
            return html + `</tbody></table>`;
        }

        function renderDynamicTableReadOnly(f) {
            const list = formData[f.listId] || [];
            if (list.length === 0) return `<div class="text-sm text-gray-400 italic bg-gray-50 p-3 rounded">暂无记录</div>`;
            let html = `<div class="overflow-x-auto border border-gray-200 rounded-md mt-2"><table class="w-full text-left text-sm"><thead class="bg-gray-100 text-gray-600"><tr class="divide-x divide-gray-200">`;
            f.columns.forEach(col => html += `<th class="py-2 px-3 font-medium">${col.label}</th>`);
            html += `</tr></thead><tbody class="divide-y divide-gray-200">`;
            list.forEach(row => {
                html += `<tr class="divide-x divide-gray-100 hover:bg-gray-50">`;
                f.columns.forEach(col => {
                    let text = row[col.id] || '--';
                    if (col.id === 'eye') text = {1:'右眼', 2:'左眼', 3:'双眼', 4:'NA'}[text] || text;
                    if (col.dependsOn && row[col.dependsOn] !== col.dependsVal) text = '--';
                    html += `<td class="py-2 px-3 text-gray-800">${text}</td>`;
                });
                html += `</tr>`;
            });
            return html + `</tbody></table></div>`;
        }

        function renderDynamicTableEdit(f) {
            const list = formData[f.listId] || [];
            let html = `<div class="border border-blue-200 rounded-md mt-2 overflow-hidden fade-in"><table class="w-full text-left text-sm bg-white"><thead class="bg-blue-50 text-blue-800"><tr class="divide-x divide-blue-100">`;
            f.columns.forEach(col => html += `<th class="py-2 px-3 font-medium ${col.width}">${col.label}</th>`);
            html += `<th class="py-2 px-3 font-medium w-16 text-center">操作</th></tr></thead><tbody class="divide-y divide-gray-200">`;
            list.forEach((row, index) => {
                html += `<tr class="divide-x divide-gray-100">`;
                f.columns.forEach(col => {
                    const val = row[col.id] || '';
                    const isHidden = col.dependsOn && row[col.dependsOn] !== col.dependsVal;
                    html += `<td class="py-2 px-2">`;
                    if (!isHidden) {
                        if (col.type === 'select') {
                            html += `<select onchange="updateList('${f.listId}', ${index}, '${col.id}', this.value)" class="w-full border border-gray-300 rounded p-1.5 focus:ring-1 focus:ring-blue-500 outline-none"><option value="">请选择</option>${col.options.map(o => `<option value="${o.v}" ${val===o.v?'selected':''}>${o.l}</option>`).join('')}</select>`;
                        } else {
                            html += `<input type="${col.type}" value="${val}" onchange="updateList('${f.listId}', ${index}, '${col.id}', this.value)" class="w-full border border-gray-300 rounded p-1.5 focus:ring-1 focus:ring-blue-500 outline-none">`;
                        }
                    } else { html += `<div class="text-gray-300 text-center bg-gray-50 rounded p-1.5">不适用</div>`; }
                    html += `</td>`;
                });
                html += `<td class="py-2 px-2 text-center"><button onclick="removeListRow('${f.listId}', ${index})" class="text-red-500 hover:text-red-700 font-bold px-2 py-1 rounded hover:bg-red-50 transition">×</button></td></tr>`;
            });
            html += `</tbody></table><div class="bg-gray-50 p-2 border-t border-gray-200"><button onclick="addListRow('${f.listId}')" class="text-sm text-blue-600 hover:text-blue-800 font-medium flex items-center px-2 py-1 rounded hover:bg-blue-100 transition"><svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>新增一条记录</button></div></div>`;
            return html;
        }

        function updateList(listId, index, key, value) { formData[listId][index][key] = value; renderForm(); }
        function addListRow(listId) { if(!formData[listId]) formData[listId] = []; formData[listId].push({}); renderForm(); }
        function removeListRow(listId, index) { formData[listId].splice(index, 1); renderForm(); }

    </script>
</body>
</html>
